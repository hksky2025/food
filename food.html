<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的私房食譜庫 (Chiikawa Edition)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* 自定義捲軸樣式，更配合可愛風格 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #fff0f5; 
        }
        ::-webkit-scrollbar-thumb {
            background: #fbcfe8; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #f9a8d4; 
        }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-50 via-rose-50 to-orange-50 min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 1. 圖示組件 (手動定義 SVG 以免除依賴) ---
        const IconBase = ({ children, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Plus = ({ className }) => <IconBase className={className}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></IconBase>;
        const X = ({ className }) => <IconBase className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></IconBase>;
        const ExternalLink = ({ className }) => <IconBase className={className}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></IconBase>;
        const Trash2 = ({ className }) => <IconBase className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></IconBase>;
        const Edit2 = ({ className }) => <IconBase className={className}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></IconBase>;
        const ChefHat = ({ className }) => <IconBase className={className}><path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 9.08 0A5.11 5.11 0 0 1 18.59 6 4 4 0 0 1 20 13.87V21H6Z"></path><line x1="6" y1="17" x2="20" y2="17"></line></IconBase>;
        const Camera = ({ className }) => <IconBase className={className}><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></IconBase>;
        const Upload = ({ className }) => <IconBase className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></IconBase>;

        // --- 2. 儲存功能補丁 (Storage Polyfill) ---
        const setupStorage = () => {
            if (!window.storage) {
                window.storage = {
                    get: async (key) => {
                        const value = localStorage.getItem(key);
                        return value ? { value } : null;
                    },
                    set: async (key, value) => {
                        return localStorage.setItem(key, value);
                    },
                    delete: async (key) => {
                        return localStorage.removeItem(key);
                    },
                    list: async (prefix) => {
                        const keys = [];
                        for (let i = 0; i < localStorage.length; i++) {
                            const key = localStorage.key(i);
                            if (key.startsWith(prefix)) {
                                keys.push(key);
                            }
                        }
                        return { keys };
                    }
                };
            }
        };
        setupStorage();

        // --- 3. 主程式邏輯 (RecipeManager) ---
        function RecipeManager() {
            const [recipes, setRecipes] = useState([]);
            const [showModal, setShowModal] = useState(false);
            const [selectedRecipe, setSelectedRecipe] = useState(null);
            const [editMode, setEditMode] = useState(false);
            const [imagePreview, setImagePreview] = useState(null);
            
            const [formData, setFormData] = useState({
                name: '',
                fbLink: '',
                ingredients: '',
                category: '中菜',
                cookingTime: '',
                difficulty: '中等',
                image: null
            });

            useEffect(() => {
                loadRecipes();
            }, []);

            const loadRecipes = async () => {
                try {
                    const result = await window.storage.list('recipe:');
                    if (result && result.keys) {
                        const loadedRecipes = [];
                        for (const key of result.keys) {
                            const data = await window.storage.get(key);
                            if (data && data.value) {
                                loadedRecipes.push(JSON.parse(data.value));
                            }
                        }
                        setRecipes(loadedRecipes.sort((a, b) => b.timestamp - a.timestamp));
                    }
                } catch (error) {
                    console.log('首次使用，暫無食譜資料');
                }
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    // 限制圖片大小 (避免 LocalStorage 爆滿)
                    if (file.size > 2 * 1024 * 1024) {
                        alert('圖片太大啦！請使用 2MB 以下的圖片 🙏');
                        return;
                    }
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setImagePreview(reader.result);
                        setFormData({...formData, image: reader.result});
                    };
                    reader.readAsDataURL(file);
                }
            };

            const saveRecipe = async () => {
                if (!formData.name || !formData.fbLink || !formData.ingredients) {
                    alert('請填寫菜名、Facebook 連結同食材！');
                    return;
                }

                // 處理食材字串轉陣列
                const ingredientsArray = Array.isArray(formData.ingredients) 
                    ? formData.ingredients 
                    : formData.ingredients.split('\n').filter(i => i.trim());

                const newRecipe = {
                    id: editMode ? selectedRecipe.id : Date.now().toString(),
                    ...formData,
                    ingredients: ingredientsArray, 
                    timestamp: editMode ? selectedRecipe.timestamp : Date.now()
                };

                try {
                    await window.storage.set(`recipe:${newRecipe.id}`, JSON.stringify(newRecipe));
                    await loadRecipes();
                    resetForm();
                    // Custom simplistic alert could be added here
                    // alert(editMode ? '食譜已更新！' : '食譜已儲存！');
                } catch (error) {
                    alert('儲存失敗，可能係圖片太大，試下細張啲嘅圖？');
                    console.error(error);
                }
            };

            const deleteRecipe = async (id) => {
                if (confirm('確定要刪除呢個食譜？')) {
                    try {
                        await window.storage.delete(`recipe:${id}`);
                        await loadRecipes();
                        setSelectedRecipe(null);
                    } catch (error) {
                        alert('刪除失敗');
                    }
                }
            };

            const resetForm = () => {
                setFormData({
                    name: '',
                    fbLink: '',
                    ingredients: '',
                    category: '中菜',
                    cookingTime: '',
                    difficulty: '中等',
                    image: null
                });
                setImagePreview(null);
                setShowModal(false);
                setEditMode(false);
            };

            const openEditModal = (recipe) => {
                setFormData({
                    name: recipe.name,
                    fbLink: recipe.fbLink,
                    ingredients: Array.isArray(recipe.ingredients) ? recipe.ingredients.join('\n') : recipe.ingredients,
                    category: recipe.category,
                    cookingTime: recipe.cookingTime,
                    difficulty: recipe.difficulty,
                    image: recipe.image
                });
                setImagePreview(recipe.image);
                setEditMode(true);
                setSelectedRecipe(recipe);
                setShowModal(true);
            };

            const categories = [
                '中菜', '西餐', '日韓料理', '甜品', '小食', '湯水',
                '減肥餐 - 早餐', '減肥餐 - 中餐', '減肥餐 - 西餐', '減肥餐 - 沙律', '減肥餐 - 日餐', '其他'
            ];
            const difficulties = ['簡單', '中等', '困難'];

            const getCategoryColor = (category) => {
                if (category && category.includes('減肥餐')) return 'from-green-100 to-emerald-50';
                return 'from-pink-50 to-rose-50';
            };

            const getCategoryBadgeColor = (category) => {
                if (category && category.includes('減肥餐')) return 'bg-green-100 text-green-700';
                return 'bg-pink-100 text-pink-700';
            };

            return (
                <div className="min-h-screen">
                    {/* Chiikawa 裝飾元素 */}
                    <div className="fixed top-4 left-4 text-6xl opacity-20 pointer-events-none select-none">🐰</div>
                    <div className="fixed bottom-4 right-4 text-6xl opacity-20 pointer-events-none select-none">🐣</div>
                    <div className="fixed top-1/3 right-8 text-5xl opacity-15 pointer-events-none select-none">🌸</div>

                    {/* Header */}
                    <div className="bg-white/80 backdrop-blur-sm shadow-sm border-b border-pink-100 sticky top-0 z-40">
                        <div className="max-w-6xl mx-auto px-4 py-6">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-4">
                                    <div className="bg-gradient-to-br from-pink-200 to-rose-200 p-3 rounded-2xl relative shadow-sm">
                                        <ChefHat className="w-8 h-8 text-rose-600" />
                                        <div className="absolute -top-2 -right-2 text-2xl">✨</div>
                                    </div>
                                    <div>
                                        <h1 className="text-2xl md:text-3xl font-light text-gray-800 tracking-wide">我的食譜庫</h1>
                                        <p className="text-gray-500 text-xs md:text-sm mt-1 font-light">記錄每一道美味佳餚 🍳</p>
                                    </div>
                                </div>
                                <button
                                    onClick={() => { resetForm(); setShowModal(true); }}
                                    className="flex items-center gap-2 bg-gradient-to-r from-pink-300 to-rose-300 text-rose-800 px-4 md:px-6 py-2 md:py-3 rounded-full font-light hover:from-pink-400 hover:to-rose-400 transition-all shadow-md hover:shadow-lg active:scale-95"
                                >
                                    <Plus className="w-5 h-5" />
                                    <span className="hidden md:inline">新增食譜</span>
                                    <span className="md:hidden">新增</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="max-w-6xl mx-auto px-4 py-8 md:py-12 pb-32">
                        {recipes.length === 0 ? (
                            <div className="text-center py-20">
                                <div className="bg-white/60 backdrop-blur-sm rounded-3xl p-12 inline-block border border-pink-100 shadow-sm">
                                    <div className="text-7xl mb-4 animate-bounce">🐰</div>
                                    <div className="bg-pink-100 text-pink-600 px-4 py-2 rounded-full inline-block mb-4 text-sm font-bold">
                                        呀哈！暫時未有食譜呀～
                                    </div>
                                    <p className="text-gray-400 font-light">開始添加你鍾意既食譜啦！</p>
                                </div>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {recipes.map(recipe => (
                                    <div
                                        key={recipe.id}
                                        className="bg-white/80 backdrop-blur-sm rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden cursor-pointer border border-pink-100 hover:border-pink-300 group flex flex-col h-full"
                                        onClick={() => setSelectedRecipe(recipe)}
                                    >
                                        {recipe.image ? (
                                            <div className="relative h-48 overflow-hidden bg-gray-100">
                                                <img 
                                                    src={recipe.image} 
                                                    alt={recipe.name}
                                                    className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"
                                                />
                                                <div className="absolute top-2 right-2 bg-white/90 backdrop-blur-sm rounded-full px-3 py-1 text-xs shadow-sm">
                                                    📸
                                                </div>
                                            </div>
                                        ) : (
                                            <div className={`bg-gradient-to-br ${getCategoryColor(recipe.category)} h-48 flex items-center justify-center border-b border-pink-100 relative overflow-hidden`}>
                                                <div className="text-center z-10">
                                                    <div className="text-6xl mb-2 drop-shadow-sm">🍽️</div>
                                                    <div className="text-xs text-gray-500 font-light">未有相片</div>
                                                </div>
                                                <div className="absolute top-0 left-0 w-full h-full bg-white/10"></div>
                                            </div>
                                        )}
                                        
                                        <div className="p-5 flex-1 flex flex-col">
                                            <h3 className="text-xl font-light text-gray-800 mb-3 group-hover:text-rose-600 transition-colors">{recipe.name}</h3>
                                            <div className="flex flex-wrap gap-2 mb-3">
                                                <span className={`${getCategoryBadgeColor(recipe.category)} text-xs px-3 py-1 rounded-full font-light`}>
                                                    {recipe.category}
                                                </span>
                                                <span className="bg-white/60 text-gray-600 text-xs px-3 py-1 rounded-full font-light border border-gray-100">
                                                    {recipe.difficulty}
                                                </span>
                                            </div>
                                            <div className="mt-auto pt-2 border-t border-pink-50 flex justify-between text-sm text-gray-500 font-light">
                                                <span>🥘 食材: {recipe.ingredients ? recipe.ingredients.length : 0} 種</span>
                                                {recipe.cookingTime && (
                                                    <span>⏱️ {recipe.cookingTime}</span>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* Add/Edit Modal */}
                    {showModal && (
                        <div className="fixed inset-0 bg-black/30 backdrop-blur-sm flex items-center justify-center p-4 z-50 transition-opacity">
                            <div className="bg-white/95 backdrop-blur-md rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl animate-[fadeIn_0.3s_ease-out]">
                                <div className="bg-gradient-to-r from-pink-100 to-rose-100 p-6 flex justify-between items-center border-b border-pink-200 sticky top-0 z-10">
                                    <div className="flex items-center gap-2">
                                        <span className="text-2xl animate-pulse">🐰</span>
                                        <h2 className="text-2xl font-light text-gray-800">
                                            {editMode ? '編輯食譜' : '新增食譜'}
                                        </h2>
                                    </div>
                                    <button onClick={resetForm} className="hover:bg-white/50 p-2 rounded-full transition-all text-gray-600 hover:text-red-500">
                                        <X className="w-6 h-6" />
                                    </button>
                                </div>

                                <div className="p-6 space-y-5">
                                    {/* 圖片上傳 */}
                                    <div>
                                        <label className="block text-sm font-light text-gray-700 mb-2">
                                            菜式相片 📸
                                        </label>
                                        <div className="relative">
                                            <input
                                                type="file"
                                                accept="image/*"
                                                onChange={handleImageUpload}
                                                className="hidden"
                                                id="image-upload"
                                            />
                                            <label
                                                htmlFor="image-upload"
                                                className="block w-full border-2 border-dashed border-pink-200 rounded-2xl p-6 cursor-pointer hover:border-pink-400 transition-all bg-pink-50/30 text-center"
                                            >
                                                {imagePreview ? (
                                                    <div className="relative group">
                                                        <img 
                                                            src={imagePreview} 
                                                            alt="Preview" 
                                                            className="w-full h-48 object-cover rounded-xl shadow-sm"
                                                        />
                                                        <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity rounded-xl flex items-center justify-center">
                                                            <div className="bg-white/20 backdrop-blur-sm p-3 rounded-full">
                                                                <Camera className="w-8 h-8 text-white" />
                                                            </div>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div className="py-4">
                                                        <Upload className="w-12 h-12 mx-auto text-pink-300 mb-2" />
                                                        <p className="text-sm text-gray-500 font-light">點擊上傳菜式相片</p>
                                                        <p className="text-xs text-gray-400 mt-1">方便記住呢味係咩樣 😋</p>
                                                    </div>
                                                )}
                                            </label>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-light text-gray-700 mb-2">菜名 *</label>
                                        <input
                                            type="text"
                                            value={formData.name}
                                            onChange={(e) => setFormData({...formData, name: e.target.value})}
                                            className="w-full px-4 py-3 border border-pink-200 rounded-2xl focus:border-pink-400 focus:outline-none bg-white/50 font-light focus:ring-2 focus:ring-pink-100 transition-all"
                                            placeholder="例如：蒜蓉蒸蝦"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-light text-gray-700 mb-2">Facebook 影片連結 *</label>
                                        <input
                                            type="url"
                                            value={formData.fbLink}
                                            onChange={(e) => setFormData({...formData, fbLink: e.target.value})}
                                            className="w-full px-4 py-3 border border-pink-200 rounded-2xl focus:border-pink-400 focus:outline-none bg-white/50 font-light focus:ring-2 focus:ring-pink-100 transition-all"
                                            placeholder="https://www.facebook.com/..."
                                        />
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div>
                                            <label className="block text-sm font-light text-gray-700 mb-2">類別</label>
                                            <select
                                                value={formData.category}
                                                onChange={(e) => setFormData({...formData, category: e.target.value})}
                                                className="w-full px-4 py-3 border border-pink-200 rounded-2xl focus:border-pink-400 focus:outline-none bg-white/50 font-light cursor-pointer appearance-none"
                                            >
                                                {categories.map(cat => (
                                                    <option key={cat} value={cat}>{cat}</option>
                                                ))}
                                            </select>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-light text-gray-700 mb-2">難度</label>
                                            <select
                                                value={formData.difficulty}
                                                onChange={(e) => setFormData({...formData, difficulty: e.target.value})}
                                                className="w-full px-4 py-3 border border-pink-200 rounded-2xl focus:border-pink-400 focus:outline-none bg-white/50 font-light cursor-pointer appearance-none"
                                            >
                                                {difficulties.map(diff => (
                                                    <option key={diff} value={diff}>{diff}</option>
                                                ))}
                                            </select>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-light text-gray-700 mb-2">時間</label>
                                            <input
                                                type="text"
                                                value={formData.cookingTime}
                                                onChange={(e) => setFormData({...formData, cookingTime: e.target.value})}
                                                className="w-full px-4 py-3 border border-pink-200 rounded-2xl focus:border-pink-400 focus:outline-none bg-white/50 font-light"
                                                placeholder="30分鐘"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-light text-gray-700 mb-2">
                                            食材清單 * (每行一種食材)
                                        </label>
                                        <textarea
                                            value={formData.ingredients}
                                            onChange={(e) => setFormData({...formData, ingredients: e.target.value})}
                                            className="w-full px-4 py-3 border border-pink-200 rounded-2xl focus:border-pink-400 focus:outline-none bg-white/50 font-light min-h-[150px]"
                                            placeholder="蝦 500克&#10;蒜頭 5瓣&#10;蔥 2條&#10;生抽 2湯匙&#10;..."
                                        />
                                    </div>

                                    <button
                                        onClick={saveRecipe}
                                        className="w-full bg-gradient-to-r from-pink-300 to-rose-300 text-rose-800 py-3 rounded-full font-light hover:from-pink-400 hover:to-rose-400 transition-all shadow-md flex items-center justify-center gap-2 active:scale-95"
                                    >
                                        <span className="text-xl">✨</span>
                                        {editMode ? '更新食譜' : '儲存食譜'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Recipe Detail Modal */}
                    {selectedRecipe && !showModal && (
                        <div className="fixed inset-0 bg-black/30 backdrop-blur-sm flex items-center justify-center p-4 z-50 transition-opacity">
                            <div className="bg-white/95 backdrop-blur-md rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl animate-[fadeIn_0.3s_ease-out]">
                                {selectedRecipe.image ? (
                                    <div className="relative h-64 overflow-hidden rounded-t-3xl bg-gray-100">
                                        <img 
                                            src={selectedRecipe.image} 
                                            alt={selectedRecipe.name}
                                            className="w-full h-full object-cover"
                                        />
                                        <button 
                                            onClick={() => setSelectedRecipe(null)}
                                            className="absolute top-4 right-4 bg-white/90 backdrop-blur-sm hover:bg-white p-2 rounded-full transition-all shadow-lg text-gray-600 hover:text-red-500 z-10"
                                        >
                                            <X className="w-6 h-6" />
                                        </button>
                                        <div className="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent p-6 pt-20">
                                            <h2 className="text-3xl font-light text-white mb-2 shadow-sm">{selectedRecipe.name}</h2>
                                        </div>
                                    </div>
                                ) : (
                                    <div className={`bg-gradient-to-br ${getCategoryColor(selectedRecipe.category)} p-6 border-b border-pink-200 rounded-t-3xl`}>
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <h2 className="text-3xl font-light text-gray-800 mb-3">{selectedRecipe.name}</h2>
                                            </div>
                                            <button 
                                                onClick={() => setSelectedRecipe(null)}
                                                className="hover:bg-white/50 p-2 rounded-full transition-all text-gray-600 hover:text-red-500"
                                            >
                                                <X className="w-6 h-6" />
                                            </button>
                                        </div>
                                    </div>
                                )}

                                <div className="p-6">
                                    <div className="flex flex-wrap gap-2 mb-6">
                                        <span className={`${getCategoryBadgeColor(selectedRecipe.category)} px-3 py-1 rounded-full text-sm font-light`}>
                                            {selectedRecipe.category}
                                        </span>
                                        <span className="bg-white/60 text-gray-600 px-3 py-1 rounded-full text-sm font-light border border-gray-100">
                                            {selectedRecipe.difficulty}
                                        </span>
                                        {selectedRecipe.cookingTime && (
                                            <span className="bg-white/60 text-gray-600 px-3 py-1 rounded-full text-sm font-light border border-gray-100">
                                                ⏱️ {selectedRecipe.cookingTime}
                                            </span>
                                        )}
                                    </div>

                                    <div className="mb-6">
                                        <div className="flex items-center gap-2 mb-4">
                                            <span className="text-2xl animate-bounce">🐣</span>
                                            <h3 className="text-lg font-light text-gray-800">所需食材</h3>
                                            <div className="bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full text-xs ml-2">
                                                烏啦～準備好啦！
                                            </div>
                                        </div>
                                        <ul className="space-y-2 bg-pink-50/50 rounded-2xl p-4 border border-pink-100/50">
                                            {selectedRecipe.ingredients.map((ingredient, index) => (
                                                <li key={index} className="flex items-start gap-3 text-gray-700 font-light hover:bg-pink-50 rounded-lg p-1 transition-colors">
                                                    <span className="text-pink-400 mt-1 text-sm">✦</span>
                                                    <span>{ingredient}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>

                                    <div className="flex gap-3 flex-col sm:flex-row">
                                        <a
                                            href={selectedRecipe.fbLink}
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            className="flex-1 bg-gradient-to-r from-blue-300 to-blue-400 text-blue-900 px-4 py-3 rounded-full font-light hover:from-blue-400 hover:to-blue-500 transition-all flex items-center justify-center gap-2 shadow-md hover:shadow-lg active:scale-95"
                                        >
                                            <ExternalLink className="w-5 h-5" />
                                            觀看教學影片
                                        </a>
                                        <div className="flex gap-3">
                                            <button
                                                onClick={() => openEditModal(selectedRecipe)}
                                                className="flex-1 sm:flex-none bg-gradient-to-r from-amber-200 to-orange-200 text-orange-800 px-6 py-3 rounded-full hover:from-amber-300 hover:to-orange-300 transition-all shadow-md active:scale-95 flex items-center justify-center"
                                            >
                                                <Edit2 className="w-5 h-5" />
                                            </button>
                                            <button
                                                onClick={() => deleteRecipe(selectedRecipe.id)}
                                                className="flex-1 sm:flex-none bg-gradient-to-r from-red-200 to-pink-200 text-red-800 px-6 py-3 rounded-full hover:from-red-300 hover:to-pink-300 transition-all shadow-md active:scale-95 flex items-center justify-center"
                                            >
                                                <Trash2 className="w-5 h-5" />
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RecipeManager />);
    </script>
</body>
</html>
