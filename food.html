<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的私房食譜庫 (Chiikawa Edition)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* 吉伊卡哇風格：軟綿綿的字體與捲軸 */
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap');
        
        body {
            font-family: 'Zen Maru Gothic', 'Microsoft JhengHei', sans-serif;
        }

        /* 粉嫩的捲軸 */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #fff0f5; 
        }
        ::-webkit-scrollbar-thumb {
            background: #fbcfe8; 
            border-radius: 10px;
            border: 2px solid #fff0f5;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #f9a8d4; 
        }

        /* 動畫：輕微漂浮 */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-50 via-white to-blue-50 min-h-screen relative overflow-x-hidden">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 圖示組件 ---
        const IconBase = ({ children, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Plus = ({ className }) => <IconBase className={className}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></IconBase>;
        const X = ({ className }) => <IconBase className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></IconBase>;
        const ExternalLink = ({ className }) => <IconBase className={className}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></IconBase>;
        const Trash2 = ({ className }) => <IconBase className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></IconBase>;
        const Edit2 = ({ className }) => <IconBase className={className}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></IconBase>;
        const ChefHat = ({ className }) => <IconBase className={className}><path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 9.08 0A5.11 5.11 0 0 1 18.59 6 4 4 0 0 1 20 13.87V21H6Z"></path><line x1="6" y1="17" x2="20" y2="17"></line></IconBase>;
        const Camera = ({ className }) => <IconBase className={className}><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></IconBase>;
        const Upload = ({ className }) => <IconBase className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></IconBase>;

        // --- 儲存功能補丁 ---
        const setupStorage = () => {
            if (!window.storage) {
                window.storage = {
                    get: async (key) => {
                        const value = localStorage.getItem(key);
                        return value ? { value } : null;
                    },
                    set: async (key, value) => {
                        return localStorage.setItem(key, value);
                    },
                    delete: async (key) => {
                        return localStorage.removeItem(key);
                    },
                    list: async (prefix) => {
                        const keys = [];
                        for (let i = 0; i < localStorage.length; i++) {
                            const key = localStorage.key(i);
                            if (key.startsWith(prefix)) {
                                keys.push(key);
                            }
                        }
                        return { keys };
                    }
                };
            }
        };
        setupStorage();

        // --- 主程式邏輯 ---
        function RecipeManager() {
            const [recipes, setRecipes] = useState([]);
            const [showModal, setShowModal] = useState(false);
            const [selectedRecipe, setSelectedRecipe] = useState(null);
            const [editMode, setEditMode] = useState(false);
            const [imagePreview, setImagePreview] = useState(null);
            
            const [formData, setFormData] = useState({
                name: '',
                fbLink: '',
                ingredients: '',
                category: '中菜',
                cookingTime: '',
                difficulty: '中等',
                image: null
            });

            useEffect(() => {
                loadRecipes();
            }, []);

            const loadRecipes = async () => {
                try {
                    const result = await window.storage.list('recipe:');
                    if (result && result.keys) {
                        const loadedRecipes = [];
                        for (const key of result.keys) {
                            const data = await window.storage.get(key);
                            if (data && data.value) {
                                loadedRecipes.push(JSON.parse(data.value));
                            }
                        }
                        setRecipes(loadedRecipes.sort((a, b) => b.timestamp - a.timestamp));
                    }
                } catch (error) {
                    console.log('No recipes found');
                }
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 2 * 1024 * 1024) {
                        alert('圖片太大了！請用 2MB 以下的圖片 ( > < )');
                        return;
                    }
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setImagePreview(reader.result);
                        setFormData({...formData, image: reader.result});
                    };
                    reader.readAsDataURL(file);
                }
            };

            const saveRecipe = async () => {
                if (!formData.name || !formData.fbLink || !formData.ingredients) {
                    alert('不可以偷懶喔！請填寫菜名、連結和食材～');
                    return;
                }

                const ingredientsArray = Array.isArray(formData.ingredients) 
                    ? formData.ingredients 
                    : formData.ingredients.split('\n').filter(i => i.trim());

                const newRecipe = {
                    id: editMode ? selectedRecipe.id : Date.now().toString(),
                    ...formData,
                    ingredients: ingredientsArray, 
                    timestamp: editMode ? selectedRecipe.timestamp : Date.now()
                };

                try {
                    await window.storage.set(`recipe:${newRecipe.id}`, JSON.stringify(newRecipe));
                    await loadRecipes();
                    resetForm();
                } catch (error) {
                    alert('儲存失敗了... 是不是圖片太大了？');
                }
            };

            const deleteRecipe = async (id) => {
                if (confirm('真的要刪除這個食譜嗎？(哭)')) {
                    try {
                        await window.storage.delete(`recipe:${id}`);
                        await loadRecipes();
                        setSelectedRecipe(null);
                    } catch (error) {
                        alert('刪除失敗');
                    }
                }
            };

            const resetForm = () => {
                setFormData({
                    name: '',
                    fbLink: '',
                    ingredients: '',
                    category: '中菜',
                    cookingTime: '',
                    difficulty: '中等',
                    image: null
                });
                setImagePreview(null);
                setShowModal(false);
                setEditMode(false);
            };

            const openEditModal = (recipe) => {
                setFormData({
                    name: recipe.name,
                    fbLink: recipe.fbLink,
                    ingredients: Array.isArray(recipe.ingredients) ? recipe.ingredients.join('\n') : recipe.ingredients,
                    category: recipe.category,
                    cookingTime: recipe.cookingTime,
                    difficulty: recipe.difficulty,
                    image: recipe.image
                });
                setImagePreview(recipe.image);
                setEditMode(true);
                setSelectedRecipe(recipe);
                setShowModal(true);
            };

            const categories = [
                '中菜', '西餐', '日韓料理', '甜品', '小食', '湯水',
                '減肥餐 - 早餐', '減肥餐 - 中餐', '減肥餐 - 西餐', '減肥餐 - 沙律', '減肥餐 - 日餐', '其他'
            ];
            const difficulties = ['簡單', '中等', '困難'];

            // Chiikawa 配色邏輯
            const getCategoryColor = (category) => {
                if (category && category.includes('減肥餐')) return 'bg-emerald-100/50 text-emerald-700 border-emerald-200';
                if (category === '甜品') return 'bg-yellow-100/50 text-yellow-700 border-yellow-200';
                return 'bg-pink-100/50 text-pink-700 border-pink-200';
            };

            const getCardGradient = (index) => {
                const gradients = [
                    'from-pink-50 to-white', // Chiikawa
                    'from-blue-50 to-white', // Hachiware
                    'from-yellow-50 to-white' // Usagi
                ];
                return gradients[index % 3];
            };

            return (
                <div className="min-h-screen pb-20 font-medium text-gray-700">
                    
                    {/* 背景裝飾 (Floating Emojis) */}
                    <div className="fixed top-10 left-10 text-6xl opacity-30 animate-float select-none pointer-events-none z-0">🐰</div>
                    <div className="fixed bottom-20 right-10 text-6xl opacity-30 animate-float select-none pointer-events-none z-0" style={{animationDelay: '1s'}}>🐱</div>
                    <div className="fixed top-1/2 left-20 text-4xl opacity-20 animate-float select-none pointer-events-none z-0" style={{animationDelay: '2s'}}>🌰</div>
                    <div className="fixed top-20 right-1/4 text-4xl opacity-20 animate-float select-none pointer-events-none z-0">🌸</div>

                    {/* Header */}
                    <div className="bg-white/70 backdrop-blur-md sticky top-0 z-40 border-b border-pink-100 shadow-sm">
                        <div className="max-w-5xl mx-auto px-6 py-4">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-4">
                                    <div className="bg-pink-100 p-3 rounded-full relative shadow-inner">
                                        <ChefHat className="w-8 h-8 text-pink-500" />
                                        <div className="absolute -top-1 -right-1 text-xl">✨</div>
                                    </div>
                                    <div>
                                        <h1 className="text-2xl font-bold text-gray-800 tracking-wider">吉伊の食譜書</h1>
                                        <p className="text-pink-400 text-xs font-bold mt-1">今天也要努力煮飯喔！</p>
                                    </div>
                                </div>
                                <button
                                    onClick={() => { resetForm(); setShowModal(true); }}
                                    className="flex items-center gap-2 bg-gradient-to-r from-pink-300 to-rose-300 text-white px-6 py-3 rounded-full font-bold hover:from-pink-400 hover:to-rose-400 transition-all shadow-md hover:shadow-pink-200 hover:-translate-y-1 active:scale-95"
                                >
                                    <Plus className="w-5 h-5" />
                                    <span className="hidden md:inline">新增食譜</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="max-w-5xl mx-auto px-6 py-10 relative z-10">
                        {recipes.length === 0 ? (
                            <div className="text-center py-20 animate-float">
                                <div className="bg-white/60 backdrop-blur-sm rounded-[3rem] p-12 inline-block border-4 border-dashed border-pink-200">
                                    <div className="text-8xl mb-4">🥺</div>
                                    <h3 className="text-xl text-pink-600 font-bold mb-2">哇... 什麼都沒有</h3>
                                    <p className="text-gray-400">趕快按右上角新增第一個食譜吧！</p>
                                </div>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                {recipes.map((recipe, index) => (
                                    <div
                                        key={recipe.id}
                                        className={`bg-gradient-to-b ${getCardGradient(index)} rounded-[2.5rem] shadow-sm hover:shadow-xl hover:shadow-pink-100/50 transition-all duration-300 cursor-pointer border-2 border-white hover:border-pink-200 group flex flex-col h-full overflow-hidden hover:-translate-y-2`}
                                        onClick={() => setSelectedRecipe(recipe)}
                                    >
                                        {/* Card Image */}
                                        <div className="h-48 relative overflow-hidden m-3 rounded-[2rem]">
                                            {recipe.image ? (
                                                <img 
                                                    src={recipe.image} 
                                                    alt={recipe.name}
                                                    className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700"
                                                />
                                            ) : (
                                                <div className="w-full h-full bg-gray-100 flex items-center justify-center text-gray-300">
                                                    <div className="text-center">
                                                        <span className="text-4xl block mb-2">🍽️</span>
                                                        <span className="text-xs font-bold">No Image</span>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                        
                                        {/* Card Content */}
                                        <div className="px-6 pb-6 pt-2 flex-1 flex flex-col">
                                            <h3 className="text-lg font-bold text-gray-800 mb-3 group-hover:text-pink-500 transition-colors line-clamp-1">
                                                {recipe.name}
                                            </h3>
                                            
                                            <div className="flex flex-wrap gap-2 mb-4">
                                                <span className={`text-xs px-3 py-1 rounded-full border ${getCategoryColor(recipe.category)}`}>
                                                    {recipe.category}
                                                </span>
                                                <span className="bg-white text-gray-500 text-xs px-3 py-1 rounded-full border border-gray-100 shadow-sm">
                                                    {recipe.difficulty}
                                                </span>
                                            </div>

                                            <div className="mt-auto pt-4 border-t border-white/50 flex justify-between text-xs text-gray-500 font-bold">
                                                <span className="flex items-center gap-1">
                                                    🥦 {recipe.ingredients ? recipe.ingredients.length : 0} 種食材
                                                </span>
                                                {recipe.cookingTime && (
                                                    <span className="flex items-center gap-1">
                                                        ⏰ {recipe.cookingTime}
                                                    </span>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* Modal Overlay */}
                    {(showModal || selectedRecipe) && (
                        <div className="fixed inset-0 bg-pink-900/20 backdrop-blur-sm flex items-center justify-center p-4 z-50 transition-opacity">
                            {/* Modal Content */}
                            <div className="bg-white/95 backdrop-blur-xl rounded-[3rem] max-w-2xl w-full max-h-[85vh] overflow-y-auto shadow-2xl border-4 border-white animate-[float_0.3s_ease-out]">
                                
                                {/* Modal Header */}
                                <div className="sticky top-0 bg-white/90 backdrop-blur-md z-10 px-8 py-6 border-b border-pink-50 flex justify-between items-center">
                                    <div className="flex items-center gap-3">
                                        <span className="text-3xl">
                                            {editMode || showModal ? '📝' : '✨'}
                                        </span>
                                        <h2 className="text-2xl font-bold text-gray-800">
                                            {showModal ? (editMode ? '修改食譜' : '寫下新食譜') : selectedRecipe.name}
                                        </h2>
                                    </div>
                                    <button 
                                        onClick={() => { setShowModal(false); setSelectedRecipe(null); }}
                                        className="bg-gray-100 hover:bg-pink-100 p-2 rounded-full transition-colors"
                                    >
                                        <X className="w-6 h-6 text-gray-500 hover:text-pink-500" />
                                    </button>
                                </div>

                                <div className="p-8">
                                    {/* --- 編輯/新增模式 --- */}
                                    {showModal && (
                                        <div className="space-y-6">
                                            {/* Image Upload */}
                                            <div className="flex justify-center">
                                                <label className="relative cursor-pointer group">
                                                    <input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />
                                                    <div className={`w-full h-64 rounded-3xl overflow-hidden border-4 border-dashed ${imagePreview ? 'border-transparent' : 'border-pink-200 bg-pink-50'} transition-all flex items-center justify-center relative`}>
                                                        {imagePreview ? (
                                                            <img src={imagePreview} className="w-full h-full object-cover" />
                                                        ) : (
                                                            <div className="text-center p-10">
                                                                <Camera className="w-10 h-10 text-pink-300 mx-auto mb-2" />
                                                                <p className="text-pink-400 font-bold">點擊上傳照片</p>
                                                            </div>
                                                        )}
                                                        <div className="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center rounded-3xl">
                                                            <span className="bg-white px-4 py-2 rounded-full text-sm font-bold shadow-lg">更換照片</span>
                                                        </div>
                                                    </div>
                                                </label>
                                            </div>

                                            {/* Inputs */}
                                            <div className="grid gap-4">
                                                <div>
                                                    <label className="block text-sm font-bold text-gray-600 mb-2 ml-2">菜名</label>
                                                    <input 
                                                        value={formData.name}
                                                        onChange={(e) => setFormData({...formData, name: e.target.value})}
                                                        className="w-full px-6 py-4 bg-gray-50 border-2 border-transparent focus:border-pink-300 rounded-2xl outline-none transition-all font-bold text-gray-700"
                                                        placeholder="例如：小八的愛心拉麵"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-bold text-gray-600 mb-2 ml-2">影片連結 (Facebook)</label>
                                                    <input 
                                                        value={formData.fbLink}
                                                        onChange={(e) => setFormData({...formData, fbLink: e.target.value})}
                                                        className="w-full px-6 py-4 bg-gray-50 border-2 border-transparent focus:border-pink-300 rounded-2xl outline-none transition-all text-sm"
                                                        placeholder="https://facebook.com/..."
                                                    />
                                                </div>
                                            </div>

                                            {/* Selects */}
                                            <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                                                <select value={formData.category} onChange={(e) => setFormData({...formData, category: e.target.value})} className="px-4 py-3 bg-gray-50 rounded-xl outline-none border-r-8 border-transparent cursor-pointer font-bold text-gray-600">
                                                    {categories.map(c => <option key={c} value={c}>{c}</option>)}
                                                </select>
                                                <select value={formData.difficulty} onChange={(e) => setFormData({...formData, difficulty: e.target.value})} className="px-4 py-3 bg-gray-50 rounded-xl outline-none border-r-8 border-transparent cursor-pointer font-bold text-gray-600">
                                                    {difficulties.map(d => <option key={d} value={d}>{d}</option>)}
                                                </select>
                                                <input value={formData.cookingTime} onChange={(e) => setFormData({...formData, cookingTime: e.target.value})} placeholder="時間 (例如 15min)" className="px-4 py-3 bg-gray-50 rounded-xl outline-none font-bold col-span-2 md:col-span-1" />
                                            </div>

                                            {/* Ingredients */}
                                            <div>
                                                <label className="block text-sm font-bold text-gray-600 mb-2 ml-2">食材清單</label>
                                                <textarea 
                                                    value={formData.ingredients}
                                                    onChange={(e) => setFormData({...formData, ingredients: e.target.value})}
                                                    className="w-full px-6 py-4 bg-gray-50 border-2 border-transparent focus:border-pink-300 rounded-2xl outline-none transition-all min-h-[150px]"
                                                    placeholder="雞蛋 2顆&#10;牛奶 100ml&#10;糖 1匙..."
                                                ></textarea>
                                            </div>

                                            <button onClick={saveRecipe} className="w-full bg-pink-400 text-white font-bold py-4 rounded-2xl hover:bg-pink-500 transition-all shadow-lg shadow-pink-200 active:scale-95 flex items-center justify-center gap-2">
                                                <span>{editMode ? '完成修改' : '放入收藏'}</span>
                                                <span className="text-xl">✨</span>
                                            </button>
                                        </div>
                                    )}

                                    {/* --- 檢視模式 --- */}
                                    {selectedRecipe && !showModal && (
                                        <div className="space-y-8">
                                            {/* Image Display */}
                                            {selectedRecipe.image && (
                                                <div className="rounded-3xl overflow-hidden shadow-lg shadow-pink-100">
                                                    <img src={selectedRecipe.image} className="w-full h-64 object-cover" />
                                                </div>
                                            )}

                                            {/* Meta Tags */}
                                            <div className="flex flex-wrap gap-3 justify-center">
                                                <span className="bg-pink-50 text-pink-600 px-4 py-2 rounded-full font-bold text-sm border border-pink-100">
                                                    🏷️ {selectedRecipe.category}
                                                </span>
                                                <span className="bg-blue-50 text-blue-600 px-4 py-2 rounded-full font-bold text-sm border border-blue-100">
                                                    🔥 {selectedRecipe.difficulty}
                                                </span>
                                                {selectedRecipe.cookingTime && (
                                                    <span className="bg-yellow-50 text-yellow-600 px-4 py-2 rounded-full font-bold text-sm border border-yellow-100">
                                                        ⏰ {selectedRecipe.cookingTime}
                                                    </span>
                                                )}
                                            </div>

                                            {/* Ingredients List */}
                                            <div className="bg-gray-50/80 rounded-3xl p-6 relative">
                                                <div className="absolute -top-4 left-6 bg-white px-3 py-1 rounded-full text-sm font-bold text-gray-400 shadow-sm border border-gray-100">
                                                    所需材料
                                                </div>
                                                <ul className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-2">
                                                    {selectedRecipe.ingredients.map((ing, i) => (
                                                        <li key={i} className="flex items-center gap-3 bg-white p-3 rounded-xl shadow-sm border border-gray-100">
                                                            <span className="text-pink-400 text-xs">●</span>
                                                            <span className="font-medium text-gray-700">{ing}</span>
                                                        </li>
                                                    ))}
                                                </ul>
                                            </div>

                                            {/* Actions */}
                                            <div className="flex flex-col sm:flex-row gap-4 pt-4">
                                                <a href={selectedRecipe.fbLink} target="_blank" className="flex-1 bg-blue-400 text-white text-center py-4 rounded-2xl font-bold hover:bg-blue-500 transition-all shadow-lg shadow-blue-100 flex items-center justify-center gap-2">
                                                    <ExternalLink className="w-5 h-5" />
                                                    看教學影片
                                                </a>
                                                <div className="flex gap-4">
                                                    <button onClick={() => openEditModal(selectedRecipe)} className="p-4 bg-yellow-100 text-yellow-600 rounded-2xl hover:bg-yellow-200 transition-colors">
                                                        <Edit2 className="w-6 h-6" />
                                                    </button>
                                                    <button onClick={() => deleteRecipe(selectedRecipe.id)} className="p-4 bg-red-100 text-red-600 rounded-2xl hover:bg-red-200 transition-colors">
                                                        <Trash2 className="w-6 h-6" />
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RecipeManager />);
    </script>
