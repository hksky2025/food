<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吉伊の福岡美食手帳 (Chiikawa Style)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* 引入圓潤、手寫感字體 */
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap');
        
        body {
            font-family: 'Zen Maru Gothic', 'Microsoft JhengHei', sans-serif;
            /* 背景：溫暖奶油米色 */
            background-color: #fffcf7; 
            color: #5c4a4a; /* 字體：柔和深棕色 */
        }

        /* 捲軸風格 */
        ::-webkit-scrollbar {
            width: 12px;
        }
        ::-webkit-scrollbar-track {
            background: #fffcf7; 
            border-left: 2px solid #efebe0;
        }
        ::-webkit-scrollbar-thumb {
            background: #e8d7c0;
            border-radius: 10px;
            border: 3px solid #fffcf7;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #dcbca0; 
        }

        /* 手繪邊框效果 */
        .hand-drawn-border {
            border: 3px solid #eaddca; 
            box-shadow: 4px 4px 0px 0px #f4eee0; 
            transition: all 0.2s ease-in-out;
        }
        .hand-drawn-border:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px 0px #f4eee0;
            border-color: #e0cdaf;
        }
        
        /* 漂浮動畫 */
        @keyframes float-warm {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .animate-float-warm {
            animation: float-warm 4s ease-in-out infinite;
        }

        /* 標題特效 */
        .title-text {
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px #f2e6d8;
        }
    </style>
</head>
<body class="min-h-screen relative overflow-x-hidden bg-[url('https://www.transparenttextures.com/patterns/cream-paper.png')]">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 1. 圖示組件 (暖棕色線條) ---
        const IconBase = ({ children, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );
        const Plus = ({ className }) => <IconBase className={className}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></IconBase>;
        const X = ({ className }) => <IconBase className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></IconBase>;
        const ExternalLink = ({ className }) => <IconBase className={className}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></IconBase>;
        const Trash2 = ({ className }) => <IconBase className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></IconBase>;
        const Edit2 = ({ className }) => <IconBase className={className}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></IconBase>;
        const ChefHat = ({ className }) => <IconBase className={className}><path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 9.08 0A5.11 5.11 0 0 1 18.59 6 4 4 0 0 1 20 13.87V21H6Z"></path><line x1="6" y1="17" x2="20" y2="17"></line></IconBase>;
        const Camera = ({ className }) => <IconBase className={className}><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></IconBase>;

        // --- 2. 儲存功能補丁 ---
        const setupStorage = () => {
            if (!window.storage) {
                window.storage = {
                    get: async (key) => {
                        const value = localStorage.getItem(key);
                        return value ? { value } : null;
                    },
                    set: async (key, value) => {
                        return localStorage.setItem(key, value);
                    },
                    delete: async (key) => {
                        return localStorage.removeItem(key);
                    },
                    list: async (prefix) => {
                        const keys = [];
                        for (let i = 0; i < localStorage.length; i++) {
                            const key = localStorage.key(i);
                            if (key.startsWith(prefix)) {
                                keys.push(key);
                            }
                        }
                        return { keys };
                    }
                };
            }
        };
        setupStorage();

        // --- 3. 主程式邏輯 ---
        function RecipeManager() {
            const [recipes, setRecipes] = useState([]);
            const [showModal, setShowModal] = useState(false);
            const [selectedRecipe, setSelectedRecipe] = useState(null);
            const [editMode, setEditMode] = useState(false);
            const [imagePreview, setImagePreview] = useState(null);
            
            const [formData, setFormData] = useState({
                name: '',
                fbLink: '',
                ingredients: '',
                category: '中菜',
                cookingTime: '',
                difficulty: '中等',
                image: null
            });

            useEffect(() => {
                loadRecipes();
            }, []);

            const loadRecipes = async () => {
                try {
                    const result = await window.storage.list('recipe:');
                    if (result && result.keys) {
                        const loadedRecipes = [];
                        for (const key of result.keys) {
                            const data = await window.storage.get(key);
                            if (data && data.value) {
                                loadedRecipes.push(JSON.parse(data.value));
                            }
                        }
                        setRecipes(loadedRecipes.sort((a, b) => b.timestamp - a.timestamp));
                    }
                } catch (error) {
                    console.log('No recipes found');
                }
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 2 * 1024 * 1024) {
                        alert('圖片太大了！請用 2MB 以下的圖片 ( > < )');
                        return;
                    }
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setImagePreview(reader.result);
                        setFormData({...formData, image: reader.result});
                    };
                    reader.readAsDataURL(file);
                }
            };

            const saveRecipe = async () => {
                if (!formData.name || !formData.fbLink || !formData.ingredients) {
                    alert('不可以偷懶喔！請填寫菜名、連結和食材～');
                    return;
                }

                const ingredientsArray = Array.isArray(formData.ingredients) 
                    ? formData.ingredients 
                    : formData.ingredients.split('\n').filter(i => i.trim());

                const newRecipe = {
                    id: editMode ? selectedRecipe.id : Date.now().toString(),
                    ...formData,
                    ingredients: ingredientsArray, 
                    timestamp: editMode ? selectedRecipe.timestamp : Date.now()
                };

                try {
                    await window.storage.set(`recipe:${newRecipe.id}`, JSON.stringify(newRecipe));
                    await loadRecipes();
                    resetForm();
                } catch (error) {
                    alert('儲存失敗了... 是不是圖片太大了？');
                }
            };

            const deleteRecipe = async (id) => {
                if (confirm('真的要刪除這個食譜嗎？(哭)')) {
                    try {
                        await window.storage.delete(`recipe:${id}`);
                        await loadRecipes();
                        setSelectedRecipe(null);
                    } catch (error) {
                        alert('刪除失敗');
                    }
                }
            };

            const resetForm = () => {
                setFormData({
                    name: '',
                    fbLink: '',
                    ingredients: '',
                    category: '中菜',
                    cookingTime: '',
                    difficulty: '中等',
                    image: null
                });
                setImagePreview(null);
                setShowModal(false);
                setEditMode(false);
            };

            const openEditModal = (recipe) => {
                setFormData({
                    name: recipe.name,
                    fbLink: recipe.fbLink,
                    ingredients: Array.isArray(recipe.ingredients) ? recipe.ingredients.join('\n') : recipe.ingredients,
                    category: recipe.category,
                    cookingTime: recipe.cookingTime,
                    difficulty: recipe.difficulty,
                    image: recipe.image
                });
                setImagePreview(recipe.image);
                setEditMode(true);
                setSelectedRecipe(recipe);
                setShowModal(true);
            };

            const categories = [
                '中菜', '西餐', '日韓料理', '甜品', '小食', '湯水',
                '減肥餐 - 早餐', '減肥餐 - 中餐', '減肥餐 - 西餐', '減肥餐 - 沙律', '減肥餐 - 日餐', '其他'
            ];
            const difficulties = ['簡單', '中等', '困難'];

            // Chiikawa 配色
            const getCategoryColor = (category) => {
                if (category && category.includes('減肥餐')) return 'bg-[#e8f5e9] text-[#558b2f] border-[#c8e6c9]';
                if (category === '甜品') return 'bg-[#fffde7] text-[#fbc02d] border-[#fff59d]';
                return 'bg-[#ffebee] text-[#d32f2f] border-[#ffcdd2]';
            };

            const getCardGradient = (index) => {
                const gradients = [
                    'from-[#fff5f7] to-[#fffcf7]', 
                    'from-[#f0f7ff] to-[#fffcf7]', 
                    'from-[#fffbea] to-[#fffcf7]' 
                ];
                return gradients[index % 3];
            };

            return (
                <div className="min-h-screen pb-20 font-medium text-[#5c4a4a]">
                    
                    {/* 背景漂浮裝飾 */}
                    <div className="fixed top-10 left-10 text-6xl opacity-10 animate-float-warm select-none pointer-events-none z-0 text-[#8d6e63]">🍜</div>
                    <div className="fixed bottom-20 right-10 text-6xl opacity-10 animate-float-warm select-none pointer-events-none z-0 text-[#8d6e63]" style={{animationDelay: '1s'}}>🚌</div>
                    <div className="fixed top-1/2 left-20 text-4xl opacity-10 animate-float-warm select-none pointer-events-none z-0 text-[#8d6e63]" style={{animationDelay: '2s'}}>✨</div>
                    <div className="fixed top-20 right-1/4 text-4xl opacity-10 animate-float-warm select-none pointer-events-none z-0 text-[#8d6e63]">🍙</div>

                    {/* Header Banner */}
                    <div className="bg-[#fffcf7]/90 backdrop-blur-sm sticky top-0 z-40 border-b-2 border-[#efebe0] shadow-[0_2px_10px_-5px_#eaddca]">
                        <div className="w-full h-32 bg-gradient-to-r from-[#ffe0b2] via-[#ffccbc] to-[#d1c4e9] opacity-30 absolute top-0 left-0 z-0 mix-blend-multiply pointer-events-none"></div>
                        <div className="max-w-5xl mx-auto px-6 py-6 relative z-10 flex items-center justify-between">
                            <div className="flex items-center gap-4">
                                <div className="bg-[#ffe0b2] p-3 rounded-full relative hand-drawn-border">
                                    <ChefHat className="w-9 h-9 text-[#d84315]" />
                                    <div className="absolute -top-2 -right-2 text-2xl animate-bounce">⭐</div>
                                </div>
                                <div>
                                    <h1 className="text-3xl font-bold tracking-wider title-text text-[#5d4037]">吉伊の福岡美食手帳</h1>
                                    <p className="text-[#8d6e63] text-sm font-bold mt-2 flex items-center gap-1">
                                        <span>地道美食・大冒險！</span>
                                        <span>😋</span>
                                    </p>
                                </div>
                            </div>
                            <button
                                onClick={() => { resetForm(); setShowModal(true); }}
                                className="flex items-center gap-2 bg-[#ffab91] text-[#5d4037] px-6 py-3 rounded-full font-bold hover:bg-[#ff8a65] transition-all hand-drawn-border active:scale-95"
                            >
                                <Plus className="w-6 h-6" />
                                <span className="hidden md:inline text-lg">紀錄美食</span>
                            </button>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="max-w-5xl mx-auto px-6 py-12 relative z-10">
                        {recipes.length === 0 ? (
                            <div className="text-center py-24 animate-float-warm">
                                <div className="bg-[#fffdfa]/80 backdrop-blur-sm rounded-[3rem] p-12 inline-block hand-drawn-border">
                                    <div className="text-8xl mb-6 opacity-80">🍜🥺</div>
                                    <h3 className="text-2xl text-[#d84315] font-bold mb-3 title-text">肚子好餓喔...</h3>
                                    <p className="text-[#8d6e63] text-lg">還沒有任何食譜呢，快點紀錄下來吧！</p>
                                </div>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
                                {recipes.map((recipe, index) => (
                                    <div
                                        key={recipe.id}
                                        className={`bg-gradient-to-b ${getCardGradient(index)} rounded-[2.5rem] hand-drawn-border cursor-pointer group flex flex-col h-full overflow-hidden relative`}
                                        onClick={() => setSelectedRecipe(recipe)}
                                    >
                                        <div className="h-52 relative overflow-hidden m-3 rounded-[2rem] border-2 border-[#efebe0]">
                                            {recipe.image ? (
                                                <img 
                                                    src={recipe.image} 
                                                    alt={recipe.name}
                                                    className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 opacity-90 group-hover:opacity-100"
                                                />
                                            ) : (
                                                <div className="w-full h-full bg-[#fff8e1] flex items-center justify-center text-[#d7ccc8]">
                                                    <div className="text-center">
                                                        <span className="text-5xl block mb-3 opacity-50">🍥</span>
                                                        <span className="text-sm font-bold">還沒有照片</span>
                                                    </div>
                                                </div>
                                            )}
                                            <div className="absolute bottom-2 right-2 bg-[#fffcf7] px-2 py-1 rounded-full text-xs border border-[#efebe0] shadow-sm">
                                                福岡美味
                                            </div>
                                        </div>
                                        
                                        <div className="px-6 pb-6 pt-3 flex-1 flex flex-col">
                                            <h3 className="text-xl font-bold text-[#5d4037] mb-3 group-hover:text-[#d84315] transition-colors line-clamp-1 title-text">
                                                {recipe.name}
                                            </h3>
                                            
                                            <div className="flex flex-wrap gap-2 mb-5">
                                                <span className={`text-xs px-3 py-1.5 rounded-full border-2 font-bold ${getCategoryColor(recipe.category)}`}>
                                                    {recipe.category}
                                                </span>
                                                <span className="bg-[#efebe0] text-[#8d6e63] text-xs px-3 py-1.5 rounded-full border-2 border-[#e0d8c8] font-bold">
                                                    難度: {recipe.difficulty}
                                                </span>
                                            </div>

                                            <div className="mt-auto pt-4 border-t-2 border-[#efebe0]/60 flex justify-between text-sm text-[#8d6e63] font-bold">
                                                <span className="flex items-center gap-1 bg-[#fff8e1] px-2 py-1 rounded-lg">
                                                    🥕 {recipe.ingredients ? recipe.ingredients.length : 0} 種食材
                                                </span>
                                                {recipe.cookingTime && (
                                                    <span className="flex items-center gap-1 bg-[#e3f2fd] text-[#42a5f5] px-2 py-1 rounded-lg border border-[#bbdefb]">
                                                        ⏰ {recipe.cookingTime}
                                                    </span>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* Modal Overlay */}
                    {(showModal || selectedRecipe) && (
                        <div className="fixed inset-0 bg-[#5d4037]/30 backdrop-blur-sm flex items-center justify-center p-4 z-50 transition-opacity">
                            <div className="bg-[#fffcf7] rounded-[3rem] max-w-2xl w-full max-h-[88vh] overflow-y-auto hand-drawn-border animate-[float_0.3s_ease-out] relative">
                                
                                <div className="sticky top-0 bg-[#fffcf7]/95 backdrop-blur-md z-10 px-8 py-6 border-b-2 border-[#efebe0] flex justify-between items-center">
                                    <div className="flex items-center gap-3">
                                        <span className="text-4xl animate-bounce">
                                            {editMode || showModal ? '📝' : '✨'}
                                        </span>
                                        <h2 className="text-3xl font-bold text-[#5d4037] title-text">
                                            {showModal ? (editMode ? '修改食譜筆記' : '寫下新發現！') : selectedRecipe.name}
                                        </h2>
                                    </div>
                                    <button 
                                        onClick={() => { setShowModal(false); setSelectedRecipe(null); }}
                                        className="bg-[#efebe0] hover:bg-[#ffccbc] p-2 rounded-full transition-colors border-2 border-[#e0d8c8] text-[#8d6e63]"
                                    >
                                        <X className="w-7 h-7" />
                                    </button>
                                </div>

                                <div className="p-8">
                                    {showModal && (
                                        <div className="space-y-7">
                                            <div className="flex justify-center">
                                                <label className="relative cursor-pointer group w-full">
                                                    <input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />
                                                    <div className={`w-full h-72 rounded-[2.5rem] overflow-hidden border-4 border-dashed ${imagePreview ? 'border-transparent' : 'border-[#d7ccc8] bg-[#fbe9e7]'} transition-all flex items-center justify-center relative hover:border-[#ffab91] hover:bg-[#ffccbc]/30`}>
                                                        {imagePreview ? (
                                                            <img src={imagePreview} className="w-full h-full object-cover opacity-90" />
                                                        ) : (
                                                            <div className="text-center p-10">
                                                                <Camera className="w-14 h-14 text-[#ffab91] mx-auto mb-4 animate-pulse" />
                                                                <p className="text-[#d84315] font-bold text-lg">貼上美食照片！</p>
                                                                <p className="text-[#8d6e63] text-sm mt-2">像拍立得一樣紀錄下來</p>
                                                            </div>
                                                        )}
                                                        {imagePreview && (
                                                            <div className="absolute inset-0 bg-[#5d4037]/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center rounded-[2.5rem]">
                                                                <span className="bg-[#fffcf7] px-6 py-3 rounded-full text-lg font-bold shadow-lg text-[#5d4037] hand-drawn-border">更換照片 📸</span>
                                                            </div>
                                                        )}
                                                    </div>
                                                </label>
                                            </div>

                                            <div className="grid gap-5">
                                                <div>
                                                    <label className="block text-lg font-bold text-[#8d6e63] mb-2 ml-3">菜名 *</label>
                                                    <input 
                                                        value={formData.name}
                                                        onChange={(e) => setFormData({...formData, name: e.target.value})}
                                                        className="w-full px-6 py-4 bg-[#fff8e1] border-2 border-[#ffe0b2] focus:border-[#ffab91] rounded-2xl outline-none transition-all font-bold text-[#5d4037] text-lg placeholder-[#d7ccc8]"
                                                        placeholder="例如：博多豚骨拉麵"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-lg font-bold text-[#8d6e63] mb-2 ml-3">Facebook 影片連結 *</label>
                                                    <input 
                                                        value={formData.fbLink}
                                                        onChange={(e) => setFormData({...formData, fbLink: e.target.value})}
                                                        className="w-full px-6 py-4 bg-[#e3f2fd] border-2 border-[#bbdefb] focus:border-[#64b5f6] rounded-2xl outline-none transition-all font-bold text-[#1565c0] placeholder-[#90caf9]"
                                                        placeholder="https://facebook.com/..."
                                                    />
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                                                <div className="relative">
                                                    <label className="block text-sm font-bold text-[#8d6e63] mb-2 ml-2">類別</label>
                                                    <select value={formData.category} onChange={(e) => setFormData({...formData, category: e.target.value})} className="w-full px-5 py-3 bg-[#fff8e1] rounded-xl outline-none border-2 border-[#ffe0b2] cursor-pointer font-bold text-[#5d4037] appearance-none">
                                                        {categories.map(c => <option key={c} value={c}>{c}</option>)}
                                                    </select>
                                                </div>
                                                <div className="relative">
                                                    <label className="block text-sm font-bold text-[#8d6e63] mb-2 ml-2">難度</label>
                                                    <select value={formData.difficulty} onChange={(e) => setFormData({...formData, difficulty: e.target.value})} className="w-full px-5 py-3 bg-[#efebe0] rounded-xl outline-none border-2 border-[#e0d8c8] cursor-pointer font-bold text-[#5d4037] appearance-none">
                                                        {difficulties.map(d => <option key={d} value={d}>{d}</option>)}
                                                    </select>
                                                </div>
                                                 <div>
                                                    <label className="block text-sm font-bold text-[#8d6e63] mb-2 ml-2">時間</label>
                                                    <input value={formData.cookingTime} onChange={(e) => setFormData({...formData, cookingTime: e.target.value})} placeholder="例如 15分鐘" className="w-full px-5 py-3 bg-[#e8f5e9] rounded-xl outline-none border-2 border-[#c8e6c9] font-bold text-[#2e7d32] placeholder-[#a5d6a7] col-span-2 md:col-span-1" />
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-lg font-bold text-[#8d6e63] mb-2 ml-3 flex items-center gap-2">
                                                    食材清單 * <span className="text-sm bg-[#fff59d] px-2 py-0.5 rounded text-[#f57f17]">記得換行喔！</span>
                                                </label>
                                                
                                                {/* --- 修正後的 Textarea --- */}
                                                <div className="relative">
                                                    <textarea 
                                                        value={formData.ingredients}
                                                        onChange={(e) => setFormData({...formData, ingredients: e.target.value})}
                                                        className="w-full px-6 py-2 bg-[#fffdeb] border-2 border-[#fff59d] focus:border-[#fdd835] rounded-2xl outline-none transition-all min-h-[180px] font-medium text-[#5d4037] placeholder-[#d7ccc8] shadow-inner text-lg"
                                                        placeholder="拉麵 1份&#10;叉燒 2片&#10;蔥花 適量..."
                                                        style={{
                                                            lineHeight: '32px',
                                                            backgroundImage: 'linear-gradient(transparent 31px, #fff176 31px)',
                                                            backgroundSize: '100% 32px',
                                                            backgroundAttachment: 'local',
                                                            paddingTop: '6px'
                                                        }}
                                                    ></textarea>
                                                    <div className="absolute -top-3 right-10 bg-[#ffab91] w-4 h-12 rounded-full border-2 border-[#e64a19] shadow-md -rotate-6 pointer-events-none"></div>
                                                </div>
                                                {/* --- 修正結束 --- */}

                                            </div>

                                            <button onClick={saveRecipe} className="w-full bg-[#ffab91] text-[#5d4037] font-bold text-xl py-5 rounded-[2rem] hover:bg-[#ff8a65] transition-all hand-drawn-border active:scale-95 flex items-center justify-center gap-3">
                                                <span>{editMode ? '修改完成！' : '放入手帳！'}</span>
                                                <span className="text-2xl animate-bounce">🎉</span>
                                            </button>
                                        </div>
                                    )}

                                    {selectedRecipe && !showModal && (
                                        <div className="space-y-8 relative">
                                            <div className="absolute -top-6 -left-6 w-20 h-8 bg-[#ffccbc] opacity-50 rotate-[-15deg] pointer-events-none"></div>
                                            <div className="absolute -top-6 -right-6 w-20 h-8 bg-[#b2dfdb] opacity-50 rotate-[15deg] pointer-events-none"></div>

                                            {selectedRecipe.image && (
                                                <div className="rounded-[2.5rem] overflow-hidden hand-drawn-border border-4 border-[#efebe0]">
                                                    <img src={selectedRecipe.image} className="w-full h-72 object-cover opacity-95" />
                                                </div>
                                            )}

                                            <div className="flex flex-wrap gap-4 justify-center">
                                                <span className={`px-5 py-2.5 rounded-full font-bold text-lg border-2 hand-drawn-border ${getCategoryColor(selectedRecipe.category)}`}>
                                                    🏷️ {selectedRecipe.category}
                                                </span>
                                                <span className="bg-[#efebe0] text-[#8d6e63] px-5 py-2.5 rounded-full font-bold text-lg border-2 border-[#e0d8c8] hand-drawn-border">
                                                    🔥 難度: {selectedRecipe.difficulty}
                                                </span>
                                                {selectedRecipe.cookingTime && (
                                                    <span className="bg-[#e3f2fd] text-[#1565c0] px-5 py-2.5 rounded-full font-bold text-lg border-2 border-[#bbdefb] hand-drawn-border">
                                                        ⏰ {selectedRecipe.cookingTime}
                                                    </span>
                                                )}
                                            </div>

                                            <div className="bg-[#fffdeb] rounded-[2.5rem] p-8 relative border-2 border-[#fff59d] shadow-[inset_0_0_20px_rgba(255,249,196,0.5)]">
                                                <div className="absolute -top-5 left-8 bg-[#fdd835] px-4 py-1.5 rounded-full text-lg font-bold text-[#5d4037] border-2 border-[#fbc02d] shadow-sm rotate-[-2deg]">
                                                    準備材料清單 📝
                                                </div>
                                                <ul className="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
                                                    {selectedRecipe.ingredients.map((ing, i) => (
                                                        <li key={i} className="flex items-center gap-3 bg-[#fffcf7]/80 p-4 rounded-2xl border-2 border-[#ffe0b2]/50 shadow-sm">
                                                            <span className="text-[#ffab91] text-xl">⭐</span>
                                                            <span className="font-bold text-[#5d4037] text-lg">{ing}</span>
                                                        </li>
                                                    ))}
                                                </ul>
                                            </div>

                                            <div className="flex flex-col sm:flex-row gap-5 pt-4">
                                                <a href={selectedRecipe.fbLink} target="_blank" className="flex-1 bg-[#64b5f6] text-white text-center py-4 rounded-[2rem] font-bold text-xl hover:bg-[#42a5f5] transition-all hand-drawn-border flex items-center justify-center gap-3 group">
                                                    <ExternalLink className="w-7 h-7 group-hover:rotate-12 transition-transform" />
                                                    看教學影片 📺
                                                </a>
                                                <div className="flex gap-4">
                                                    <button onClick={() => openEditModal(selectedRecipe)} className="p-4 bg-[#fff176] text-[#f57f17] rounded-[2rem] hover:bg-[#ffee58] transition-colors hand-drawn-border border-[#fdd835]">
                                                        <Edit2 className="w-8 h-8" />
                                                    </button>
                                                    <button onClick={() => deleteRecipe(selectedRecipe.id)} className="p-4 bg-[#ff8a80] text-white rounded-[2rem] hover:bg-[#ff5252] transition-colors hand-drawn-border border-[#e57373]">
                                                        <Trash2 className="w-8 h-8" />
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RecipeManager />);
    </script>
</body>
</html>
